<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1000" height="560" fill="#ffffff"/>
  <defs>
    <marker id="a2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
    <marker id="a2g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <marker id="a2r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">一次执行的结局分流：谁占了「今天」，谁还能再来</text>

  <!-- Start -->
  <rect x="60" y="240" width="120" height="56" rx="24" fill="#1e293b"/>
  <text x="120" y="274" text-anchor="middle" font-size="15" fill="#ffffff">tick 触发</text>

  <!-- Query -->
  <rect x="230" y="228" width="150" height="80" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="305" y="258" text-anchor="middle" font-size="14" font-weight="600" fill="#1e40af">query_sign_status</text>
  <text x="305" y="278" text-anchor="middle" font-size="11" fill="#475569">判定必须早于业务体解析</text>
  <text x="305" y="294" text-anchor="middle" font-size="11" fill="#475569">网关 503 也会带合法 JSON</text>

  <line x1="180" y1="268" x2="226" y2="268" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- Outcomes -->
  <!-- success -->
  <rect x="470" y="70" width="190" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="565" y="93" text-anchor="middle" font-size="14" font-weight="600" fill="#14532d">success / alreadySigned</text>
  <text x="565" y="112" text-anchor="middle" font-size="12" fill="#475569">终态 · 今天占了 · 不再来</text>

  <!-- WindowPending -->
  <rect x="470" y="160" width="190" height="66" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <text x="565" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">windowPending</text>
  <text x="565" y="203" text-anchor="middle" font-size="11.5" fill="#475569">非终态 · 不通知 · 不吃补偿额度</text>
  <text x="565" y="218" text-anchor="middle" font-size="11.5" fill="#475569">按间隔回头再看（Qoder 10:00 开窗）</text>

  <!-- retryable -->
  <rect x="470" y="262" width="190" height="66" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="565" y="286" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">retryable（仅 Http）</text>
  <text x="565" y="305" text-anchor="middle" font-size="11.5" fill="#475569">按补偿额度 + 间隔补试</text>
  <text x="565" y="320" text-anchor="middle" font-size="11.5" fill="#475569">出厂 2 次 / 5 分钟</text>

  <!-- failed terminal -->
  <rect x="470" y="364" width="190" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="565" y="387" text-anchor="middle" font-size="14" font-weight="600" fill="#7f1d1d">failed / needManual（终态）</text>
  <text x="565" y="406" text-anchor="middle" font-size="12" fill="#475569">凭证过期 · 接口变更 · 业务拒绝</text>
  <text x="565" y="420" text-anchor="middle" font-size="11" fill="#94a3b8">重试无意义 → 等用户处理</text>

  <!-- remind -->
  <rect x="470" y="456" width="190" height="56" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="565" y="479" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">reminded（仅提醒模式）</text>
  <text x="565" y="498" text-anchor="middle" font-size="12" fill="#475569">只发通知 · 发过一次不再提</text>

  <line x1="380" y1="248" x2="466" y2="106" stroke="#16a34a" stroke-width="1.5" marker-end="url(#a2g)"/>
  <line x1="380" y1="262" x2="466" y2="190" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="380" y1="278" x2="466" y2="288" stroke="#ea580c" stroke-width="1.5" marker-end="url(#a2)"/>
  <line x1="380" y1="294" x2="466" y2="384" stroke="#dc2626" stroke-width="1.5" marker-end="url(#a2r)"/>
  <line x1="380" y1="304" x2="466" y2="476" stroke="#475569" stroke-width="1.5" marker-end="url(#a2)"/>

  <!-- loop back: windowPending & retryable re-enter after interval -->
  <path d="M 660 193 C 740 170 780 200 780 250 C 780 292 660 268 665 262"
        fill="none" stroke="#ca8a04" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <text x="820" y="228" text-anchor="middle" font-size="11.5" fill="#854d0e">间隔后重新 is_due</text>

  <path d="M 660 300 C 760 320 780 340 780 260 C 780 236 730 220 664 200"
        fill="none" stroke="#ea580c" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a2)"/>
  <text x="852" y="300" text-anchor="middle" font-size="11.5" fill="#7c2d12">额度未耗尽 + 间隔到 → 补试</text>

  <!-- key note -->
  <rect x="80" y="380" width="300" height="132" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="96" y="406" font-size="13" font-weight="700" fill="#1e293b">两条铁律</text>
  <text x="96" y="430" font-size="12" fill="#475569">① windowPending 一次都不是失败——</text>
  <text x="96" y="448" font-size="12" fill="#475569">　 它不该吃补偿额度，只该等间隔</text>
  <text x="96" y="470" font-size="12" fill="#475569">② 落成终态（alreadySigned/failed）=</text>
  <text x="96" y="488" font-size="12" fill="#475569">　 把当天后面真正到点的执行整天堵死</text>

  <text x="500" y="544" text-anchor="middle" font-size="12" fill="#94a3b8">调度器不 sleep：下一轮 tick（60s）自然会再看一眼 · github.com/xiangsir4088/signdock</text>
</svg>
