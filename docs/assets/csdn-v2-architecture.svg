<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="Microsoft YaHei, PingFang SC, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#475569"/>
    </marker>
  </defs>
  <text x="500" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1e293b">SignDock 架构：一套引擎，四个适配器</text>

  <!-- 三路触发 -->
  <rect x="60" y="70" width="200" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="92" text-anchor="middle" font-size="14" fill="#1e40af">调度循环</text>
  <text x="160" y="110" text-anchor="middle" font-size="12" fill="#475569">tokio interval 60s · Skip</text>

  <rect x="60" y="150" width="200" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="172" text-anchor="middle" font-size="14" fill="#1e40af">托盘菜单</text>
  <text x="160" y="190" text-anchor="middle" font-size="12" fill="#475569">立即签到（全部）</text>

  <rect x="60" y="230" width="200" height="52" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="160" y="252" text-anchor="middle" font-size="14" fill="#1e40af">界面按钮</text>
  <text x="160" y="270" text-anchor="middle" font-size="12" fill="#475569">立即执行一次</text>

  <!-- RunLocks -->
  <rect x="330" y="130" width="180" height="92" rx="8" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="420" y="158" text-anchor="middle" font-size="15" font-weight="600" fill="#854d0e">RunLocks</text>
  <text x="420" y="180" text-anchor="middle" font-size="12" fill="#475569">按产品原子执行权</text>
  <text x="420" y="198" text-anchor="middle" font-size="12" fill="#475569">抢不到 → 走开，不排队</text>
  <text x="420" y="212" text-anchor="middle" font-size="11" fill="#94a3b8">AtomicBool + CAS + Drop 复位</text>

  <!-- Engine -->
  <rect x="330" y="280" width="180" height="110" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="420" y="310" text-anchor="middle" font-size="16" font-weight="700" fill="#14532d">Engine</text>
  <text x="420" y="332" text-anchor="middle" font-size="12" fill="#475569">query_sign_status()</text>
  <text x="420" y="350" text-anchor="middle" font-size="12" fill="#475569">sign_in()</text>
  <text x="420" y="372" text-anchor="middle" font-size="11" fill="#94a3b8">临时失败/终态失败分流</text>

  <!-- Trait -->
  <rect x="580" y="290" width="150" height="90" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="655" y="320" text-anchor="middle" font-size="15" font-weight="600" fill="#6b21a8">ProductAdapter</text>
  <text x="655" y="342" text-anchor="middle" font-size="12" fill="#475569">async trait</text>
  <text x="655" y="360" text-anchor="middle" font-size="12" fill="#475569">引擎只认接口</text>

  <!-- 4 adapters -->
  <rect x="790" y="200" width="170" height="48" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="875" y="222" text-anchor="middle" font-size="13" fill="#1e293b">WorkBuddyAdapter</text>
  <text x="875" y="240" text-anchor="middle" font-size="11" fill="#94a3b8">官方 OAuth · 1710 行</text>

  <rect x="790" y="262" width="170" height="48" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="875" y="284" text-anchor="middle" font-size="13" fill="#1e293b">TraeAdapter</text>
  <text x="875" y="302" text-anchor="middle" font-size="11" fill="#94a3b8">本机登录态 · 1013 行</text>

  <rect x="790" y="324" width="170" height="48" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="875" y="346" text-anchor="middle" font-size="13" fill="#1e293b">QoderAdapter</text>
  <text x="875" y="364" text-anchor="middle" font-size="11" fill="#94a3b8">滚动窗口 10:00 · 963 行</text>

  <rect x="790" y="386" width="170" height="48" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="875" y="408" text-anchor="middle" font-size="13" fill="#1e293b">MiaodaAdapter</text>
  <text x="875" y="426" text-anchor="middle" font-size="11" fill="#94a3b8">自有 WebView2 · 777 行</text>

  <!-- Scheduler + Store + Notify -->
  <rect x="60" y="440" width="220" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="170" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">Scheduler</text>
  <text x="170" y="486" text-anchor="middle" font-size="12" fill="#475569">is_due：确定性 jitter 0~+10min</text>
  <text x="170" y="504" text-anchor="middle" font-size="12" fill="#475569">只往后推，绝不拉回窗口外</text>

  <rect x="330" y="440" width="180" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="420" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">Store (SQLite)</text>
  <text x="420" y="486" text-anchor="middle" font-size="12" fill="#475569">30 天流水 · (product_id, at) 索引</text>
  <text x="420" y="504" text-anchor="middle" font-size="12" fill="#475569">读错误绝不静默回落</text>

  <rect x="560" y="440" width="180" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="650" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">Notifier</text>
  <text x="650" y="486" text-anchor="middle" font-size="12" fill="#475569">系统通知</text>
  <text x="650" y="504" text-anchor="middle" font-size="12" fill="#475569">只报用户该管的事</text>

  <!-- Secret -->
  <rect x="790" y="440" width="170" height="76" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.5"/>
  <text x="875" y="466" text-anchor="middle" font-size="14" font-weight="600" fill="#7c2d12">Secret (DPAPI)</text>
  <text x="875" y="486" text-anchor="middle" font-size="12" fill="#475569">凭据零输入 · 封存落盘</text>
  <text x="875" y="504" text-anchor="middle" font-size="12" fill="#475569">换用户/换机器解不开</text>

  <!-- arrows: triggers -> RunLocks -->
  <line x1="260" y1="96" x2="326" y2="150" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="176" x2="326" y2="176" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="260" y1="256" x2="326" y2="202" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- RunLocks -> Engine -->
  <line x1="420" y1="226" x2="420" y2="276" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Engine -> Trait -->
  <line x1="510" y1="335" x2="576" y2="335" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Trait -> adapters -->
  <line x1="730" y1="318" x2="786" y2="240" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="730" y1="330" x2="786" y2="284" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="730" y1="345" x2="786" y2="346" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="730" y1="358" x2="786" y2="404" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Engine -> Store / Notify -->
  <line x1="390" y1="390" x2="330" y2="436" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="470" y1="390" x2="600" y2="436" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Store -> Scheduler (feedback loop) -->
  <path d="M 330 500 C 250 540 200 540 172 520" fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="248" y="556" text-anchor="middle" font-size="11" fill="#94a3b8">today_summary → is_due</text>

  <!-- Adapter -> Secret -->
  <line x1="875" y1="434" x2="875" y2="436" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <text x="500" y="610" text-anchor="middle" font-size="12" fill="#94a3b8">github.com/xiangsir4088/signdock · Rust 后端 6422 行 · 213 条单测</text>
</svg>
